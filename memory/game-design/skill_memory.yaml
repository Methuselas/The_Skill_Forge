- id: GAMEDESIGN_MEM_001
  scope_type: topic
  scope_id: mechanical_architecture
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'Across multiple system teardowns, designs that reused a small mechanical
    vocabulary across many situations were easier to explain, compare, and extend
    than designs that required unrelated resolution families or conversion rules between
    subsystems. In established systems, preserving a familiar high-frequency resolution
    grammar also reduced migration and relearning cost. GURPS further showed that
    shared primitives can reduce fragmentation while increasing interaction density
    when many conditional modules feed the same resources and derived values, and
    that a later edition can substantially improve that architecture without materially
    repositioning the underlying play experience. Rolemaster further showed that a
    shared percentile randomizer can sit above several operational grammars: static
    maneuvers, moving maneuvers, attacks, criticals, resistance, casting, and recovery
    may share d100 while still requiring different interpretation procedures and table
    paths.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Reusable primitives reduce interface cost between subsystems 
      while still allowing local specialization.
  boundary: Verified across Palladium Fantasy, Rifts, Star Frontiers, 
    FrontierSpace, Zebulon’s Guide, a historical Star Frontiers redesign 
    prototype, GURPS Fourth Edition Basic Set, and the Rolemaster SS-to-FRP 
    comparison; not yet tested through original system construction from a blank
    foundation.
