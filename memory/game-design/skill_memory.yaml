- id: GAMEDESIGN_MEM_002
  scope_type: topic
  scope_id: complexity_value
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'Complexity was most defensible in the analyzed systems when an added rule created a meaningful decision,
    useful consequence, or reusable capability. Placement and frequency materially changed that value: substantial
    opt-in complexity attached to new capabilities could be welcomed, while smaller mandatory complexity inserted
    into already-satisfactory high-frequency procedures was experienced as friction. GURPS added two further pressures:
    several individually conditional rules can become expensive when they activate together, and coherent simulation
    can still overtax humans when much of the work is arithmetic, lookup, dependency propagation, or state maintenance
    rather than decision-making.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Asking what each layer of complexity buys in play is a productive diagnostic for healthy versus
      unhealthy crunch.
  boundary: Verified in comparative analysis of active defense, vehicle rules, FrontierSpace action economy, legacy
    subsystem accretion, Zebulon’s resolution replacement versus additive equipment, historical Star Frontiers playtests,
    and GURPS Fourth Edition combat, injury, hazards, skills, vehicles, magic, and psionics; not yet calibrated
    against a new game designed from scratch.
  evidence_count: 6
  evidence_events:
  - GAMEDESIGN_EV_0001
  - GAMEDESIGN_EV_0002
  - GAMEDESIGN_EV_0003
  - GAMEDESIGN_EV_0005
  - GAMEDESIGN_EV_0006
  - GAMEDESIGN_EV_0007
  evidence_origin:
  - training_benchmark
