- id: GAMEDESIGN_MEM_008
  scope_type: topic
  scope_id: persistent_capability_dependencies
  type: known_boundary
  evidence_class: stochastic_performance
  observation: Related-skill defaults supported useful runtime competence 
    transfer, but persistent advancement became difficult to maintain when 
    purchased investment had to be reinterpreted against a changing default 
    source. Edition comparison showed this burden survived major Fourth Edition 
    skill refactoring even while Techniques adopted a cleaner one-way parent 
    relationship, demonstrating that one retained legacy dependency can dominate
    usability inside an otherwise improved subsystem.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Persistent character state is easier to maintain when 
      dependencies are local and explicit, while temporary competence transfer 
      remains a runtime rule instead of a mutable accounting baseline.
  boundary: Verified in the GURPS Fourth Edition standalone skill review and 
    Third-to-Fourth Edition skill comparison; not yet tested in an original 
    character system built around reversible defaults.
