- id: GAMEDESIGN_MEM_005
  scope_type: topic
  scope_id: mixed_revision_isolation
  type: training_result
  evidence_class: stochastic_performance
  observation: A bundled redesign was rejected in play while some components inside the same test package were explicitly
    welcomed and retained as useful ideas. Package-level failure therefore did not establish that every bundled
    change had failed.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: When several variables change at once, decomposing mixed feedback into retained, rejected, and unresolved
      components preserves valid evidence that would be lost by treating the whole build as one result.
  boundary: Observed in one retrospective Star Frontiers playtest case where a core-resolution redesign was rejected
    after one session while expanded skills were liked and a separate detailed robot-construction subsystem was
    welcomed; needs transfer testing on additional bundled revisions.
  evidence_count: 1
  evidence_events:
