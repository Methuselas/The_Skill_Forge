    bonuses. High Initiative could produce several full Combat Phases in one three-second turn, each capable of invoking complete
    attack and consequence procedures; early wounds could then reduce or remove an opponent's later actions, creating positive-feedback
    tempo dominance and unequal decision cadence. Shadowrun 4E independently retained the problem as an engine-wide power currency:
    augmentation, magic, adepts, VR, astral play, drones, sprites, and other autonomous actors could grant additional full Initiative
    Passes. The drone rules exposed a second multiplier: one cheap command could activate several independently resolving three-pass
    actors, proving that control bandwidth and actor bandwidth must be audited separately.
