- id: GAMEDESIGN_MEM_009
  scope_type: topic
  scope_id: character_option_economics
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: GURPS edition evolution showed that character-option prices need to reflect actual mechanical leverage
    and constraint rather than conceptual symmetry. Repricing DX, adding intermediate Talents, separating secondary
    characteristics, and parameterizing disadvantage severity improved differentiation, while disadvantage refunds
    still created pressure to consume the allowed negative budget. Fourth Edition also removed the older double-cost
    surcharge for post-creation attribute improvement, showing that build-lifecycle pricing can create optimization
    pressure when the same persistent capability has different prices solely because of purchase timing.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Auditing breadth, downstream effects, substitution economics, and actual loss of choice produces
      more stable character pricing than equal-cost symmetry or label-based valuation.
  boundary: Verified in GURPS Third-to-Fourth Edition character-economy comparison; not yet corroborated across
    another point-buy RPG.
  evidence_count: 1
  evidence_events:
  - GAMEDESIGN_EV_0008
  evidence_origin:
  - human_teaching
  - training_benchmark
  - user_feedback
  likely_owners:
  - PAT_price_character_options_by_mechanical_leverage_and_constraint
  - PAT_derive_character_capabilities_from_expected_play
  interventions:
  - training: Audit a character option by comparing its actual downstream leverage or constraint with legal substitutes
      that cost the same currency.
    isolation_result: improved
    retention_result: untested
    transfer_result: untested
