    learned capabilities, and disadvantages often require an in-world cause or opportunity in addition to points, while fiction
    can also grant or remove traits without conserving point total. The same causal model can become administrative overhead
    if the facilitator must audit every hour, exposure, teacher, or action rather than tracking only the evidence the campaign
    actually values.'
