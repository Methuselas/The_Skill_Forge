- id: GAMEDESIGN_MEM_004
  scope_type: topic
  scope_id: extension_and_refactoring
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'When a new requirement could be expressed through an existing mechanical
    vocabulary, extension stayed more coherent; repeated need for adapters, bespoke
    resolution rules, or exception chains correlated with designs that had grown beyond
    their original architecture. Comparative review also showed that replacing an
    established answer to an already-solved question can create migration cost even
    when the replacement is mechanically sound, while new mechanics are easier to
    justify when they answer genuinely new questions. GURPS edition evolution further
    showed a productive refactoring cycle: genre or supplement mechanics can function
    as laboratories, prove broadly reusable, become shared grammar, and then make
    older duplicate subsystems removable while preserving their important fictional
    and experiential affordances. Rolemaster FRP supplied a second refactoring example:
    it preserved the underlying combat identity while consolidating many specialized
    attack and maneuver tables into shared family structures plus compact differentiating
    data, reducing retrieval fragmentation without erasing the meaningful output differences.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Testing existing primitives before adding a new mechanic is a 
      practical refactoring trigger rather than a demand for one universal 
      mechanic.
  boundary: Verified while contrasting Rifts subsystem accretion, FrontierSpace 
    reuse, Alpha Dawn with Zebulon’s replacement architecture, a historical Star
    Frontiers redesign prototype, GURPS Fourth Edition refactoring, and 
    Rolemaster SS-to-FRP table consolidation; not yet tested during live 
    refactoring of a current original game.
