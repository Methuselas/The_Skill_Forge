  scope_id: construction_system_breadth
  type: known_boundary
  evidence_class: stochastic_performance
  observation: A construction system can present many legal configuration choices while producing little meaningful
    build differentiation when a small set of parent variables determines most downstream capabilities and optimal
    choices converge.
