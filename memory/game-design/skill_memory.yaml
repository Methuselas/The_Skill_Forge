- id: GAMEDESIGN_MEM_016
  scope_type: topic
  scope_id: capability_dependency
  type: training_result
  evidence_class: stochastic_performance
  observation: Cyberpunk 2020 repeatedly tied major capability gains to ongoing dependencies or vulnerabilities through financed
    cyberware, Humanity loss, medical dependence, drugs, and institutional leverage. Shadowrun 3E corroborated the broader
    pattern through Essence/Magic incompatibility, harder magical healing for heavily cybered bodies, black-market acquisition
    and legality, foci/signatures, contact favors, vehicle repair, and specialist equipment that created support or exposure
    requirements. Shadowrun 4E further corroborated the pattern through wireless connectivity that simultaneously created remote
    capability, attack surface, and datatrails; augmentation that traded nuyen against irreversible Essence capacity and magical
    healing compatibility; sustaining, hot-sim, and jumped-in control that exchanged superior performance for ongoing penalties
    or neurological risk; contacts that converted immediate access into favors; and lifestyle that converted stability into
    recurring economic pressure. Greater power can therefore increase future obligations and interfaces rather than simply remove constraints.
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Persistent costs create more campaign output than one-time prices when the intended experience treats power
      as compromising or dependent.
  boundary: Verified in two cyberpunk systems with different implementations. The principle does not require every upgrade
    in every genre to carry a persistent cost; apply it where dependence, compromise, maintenance, or exposure is part of
    the intended experience.
