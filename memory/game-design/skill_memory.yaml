- id: GAMEDESIGN_MEM_021
  scope_type: topic
  scope_id: aggregate_justified_complexity
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Shadowrun 3E contained relatively few major rules whose local purpose was obviously empty: gear fields changed
    access/exposure, Magic produced Force/Drain decisions, Matrix security modeled escalating detection, and vehicle state
    changed shared tactics. Even so, the total human operating budget remained high because many individually justified domains
    could converge in one session and one gamemaster had to integrate all of them. Local justification therefore did not guarantee
    acceptable aggregate complexity. Shadowrun 4E then reduced many local costs through fixed-TN unification, Device Rating,
    grunt compression, routine-action omission, abstract chase ranges, and shared timing, yet global integration remained high
    because physical, Matrix, magical, vehicle, social, economic, legal, and reputational states interacted more directly. The
    redesign therefore showed that interoperability can improve local coherence while moving work into cross-domain state integration,
    and that actor/event throughput must be budgeted separately from per-resolution complexity.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Complexity needs both local output justification and an aggregate concurrency/integration budget, especially
      when player specialization distributes learning but facilitator responsibility remains centralized.
  boundary: Repeated across Shadowrun 3E and 4E. The exact global budget depends on table size, domain concurrency, actor count,
    facilitator expertise, and how aggressively the design compresses low-value state and routine procedures.
