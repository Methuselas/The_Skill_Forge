- id: GAMEDESIGN_MEM_010
  scope_type: topic
  scope_id: causal_advancement
  type: known_boundary
  evidence_class: stochastic_performance
  observation: 'GURPS preserved a useful separation between mechanical advancement
    value and fictional change: social traits, learned capabilities, and disadvantages
    often require an in-world cause or opportunity in addition to points, while fiction
    can also grant or remove traits without conserving point total. The same causal
    model can become administrative overhead if the facilitator must audit every hour,
    exposure, teacher, or action rather than tracking only the evidence the campaign
    actually values.'
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Separating advancement price, permission, and fictional cause 
      preserves believable development without forcing build currency to 
      manufacture fiction or requiring exhaustive causal surveillance.
  boundary: Verified in GURPS Third-to-Fourth Edition advancement comparison; 
    not yet corroborated across another advancement system with causal purchase 
    restrictions.
