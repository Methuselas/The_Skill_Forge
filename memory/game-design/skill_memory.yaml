- id: GAMEDESIGN_MEM_006
  scope_type: topic
  scope_id: onboarding_and_curation
  type: known_boundary
  evidence_class: stochastic_performance
  observation: Large modular toolkits can remain intimidating to first-time facilitators even when most subsystems
    are technically optional. The GURPS lineage showed that consolidation and indexing can make a mature edition
    more useful to experienced users while simultaneously removing or weakening executable teaching support for
    newcomers. Fourth Edition character templates demonstrate that curated starting structures can successfully
    hide a large option space from novice players, whereas GM setup still depended heavily on prior knowledge of
    the rules corpus. The final comparison therefore treats expert reference quality and first-campaign guidance
    as different usability dimensions rather than expecting one to substitute for the other.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Optionality reduces execution cost only after the user can identify dependencies, safe omissions,
      and expansion triggers; a curated sufficient starting configuration lowers that curation burden.
  boundary: Verified in the GURPS Fourth Edition core review and in the Third Edition Revised-to-Fourth Edition
    evolution review; not yet tested against a newly authored edition transition.
  evidence_origin:
  - training_benchmark
  - human_teaching
  - user_feedback
  likely_owners:
  - PAT_make_the_game_operable_without_hidden_designer_knowledge
  interventions:
  - training: During novice handoff, require the facilitator to identify a sufficient first-campaign rule set and
      the triggers for adding optional modules without surveying the entire corpus.
    isolation_result: improved
    retention_result: untested
    transfer_result: untested
