- id: GAMEDESIGN_MEM_007
  scope_type: topic
  scope_id: operator_complexity_and_medium
  type: known_boundary
  evidence_class: stochastic_performance
  observation: Detailed simulation that felt too burdensome for manual tabletop operation was judged attractive
    in a computer implementation when software could perform dependency propagation, modifier stacking, timers,
    and state maintenance while leaving tactical and character decisions visible. The value depended on preserving
    inspectable causality rather than hiding why automated results changed.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Separating decision complexity from operator complexity helps determine which simulation detail
      should be preserved, collapsed, or automated for a target medium.
  boundary: Observed through GURPS Fourth Edition analysis and practitioner comparison between tabletop operation
    and a hypothetical computer implementation; needs implementation or cross-medium testing.
  evidence_origin:
  - training_benchmark
  - human_teaching
  - user_feedback
  likely_owners:
