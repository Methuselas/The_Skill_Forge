- id: GAMEDESIGN_MEM_015
  scope_type: topic
  scope_id: participation_coverage
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Cyberpunk 2020 Netrunning first showed that a specialist subsystem can have strong internal decisions and
    important shared-world consequences while still creating long non-specialist spectator time. Shadowrun Third Edition transferred
    the diagnostic across three contrasting specialist structures: Matrix play remained a parallel specialist game with strong
    shared-state outputs but weak shared-decision coupling; most Magic operated as a specialist superstructure with teammate-facing
    decisions such as Spell Defense; and Rigging was usually better integrated because privileged control operated through
    a shared physical platform. Shared-state coupling therefore cannot be used as a proxy for shared-decision coupling. Shadowrun
    4E sharpened the distinction further: wireless AR materially integrated hacking into shared physical state and a common
    initiative clock, while optimized VR still concentrated live decisions in the specialist despite synchronization. Vehicle
    rigging again succeeded through shared-platform control, whereas drone, spirit, and sprite fleets showed the opposite failure
    mode—specialist over-participation through autonomous actor multiplication. Synchronization, shared state, and shared decision
    ownership must therefore be audited separately.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: orchestration
    hypothesis: Specialist-system complexity must be budgeted partly by how many participants can make consequential decisions
      while the subsystem is active.
  boundary: Verified across Cyberpunk 2020 Netrunning and Shadowrun 3E/4E Matrix, Magic, astral, vehicle, drone, spirit, and
    sprite play. Specialist systems are not inherently bad; participation depends on exclusive state, verbs, cadence, optimized
    mode, shared-platform structure, and whether one specialist also controls multiple autonomous actors.
