- id: GAMEDESIGN_MEM_009
  scope_type: topic
  scope_id: character_option_economics
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'GURPS edition evolution showed that character-option prices need to reflect actual mechanical leverage and
    constraint rather than conceptual symmetry. Repricing DX, adding intermediate Talents, separating secondary characteristics,
    and parameterizing disadvantage severity improved differentiation, while disadvantage refunds still created pressure to
    consume the allowed negative budget. Fourth Edition also removed the older double-cost surcharge for post-creation attribute
    improvement, showing that build-lifecycle pricing can create optimization pressure when the same persistent capability
    has different prices solely because of purchase timing. Cyberpunk 2020 showed that option costs and drawbacks are build-dependent:
    REF gained compounding value through initiative, offense, skill breadth, and feedback, while Humanity/EMP, encumbrance,
    and other drawbacks were only real tradeoffs when the affected domain remained valuable to the character and campaign.
    Shadowrun 4E corroborated lifecycle and multi-currency pressure in a new point-buy system: flat or bundled Build Point costs
    fed into progressively priced Karma advancement while gear moved to nuyen, augmentation added Essence, and contacts/access
    changed acquisition mode. This created a rational build-order incentive to buy expensive depth early and cheaper breadth later,
    while ware grade, cyber/bioware mixing, cyberlimb Capacity, and capital-versus-Karma substitution rewarded catalog mastery.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Auditing breadth, downstream effects, substitution economics, and actual loss of choice produces more stable
      character pricing than equal-cost symmetry or label-based valuation.
  boundary: Verified in GURPS Third-to-Fourth Edition character-economy comparison and independently corroborated in Shadowrun
    4E point-buy / Karma / nuyen / Essence character economics. Exact exchange-rate failure depends on the currencies and campaign
    acquisition ecology.
  evidence_count: 3
  evidence_events:
