- id: GAMEDESIGN_MEM_007
  scope_type: topic
  scope_id: operator_complexity_and_medium
  type: known_boundary
  evidence_class: stochastic_performance
  observation: 'Detailed simulation that felt too burdensome for manual tabletop operation
    was judged attractive in a computer implementation when software could perform
    dependency propagation, modifier stacking, timers, and state maintenance while
    leaving tactical and character decisions visible. The value depended on preserving
    inspectable causality rather than hiding why automated results changed. Rolemaster
    provided independent cross-system corroboration: detailed attack, injury, casting,
    XP, and state procedures retained attractive fictional output while manual lookup,
    arithmetic, branching, and maintenance dominated tabletop cost; transparent software
    execution would preserve more of the output while removing human servicing work.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Separating decision complexity from operator complexity helps 
      determine which simulation detail should be preserved, collapsed, or 
      automated for a target medium.
  boundary: Observed independently through GURPS Fourth Edition and Rolemaster 
    SS/FRP analysis plus practitioner comparison between tabletop operation and 
    hypothetical software execution; still needs implementation or direct 
    cross-medium testing.
  evidence_origin:
  - training_benchmark
