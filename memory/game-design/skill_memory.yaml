- id: GAMEDESIGN_MEM_012
  scope_type: topic
  scope_id: consequence_duration_and_campaign_cadence
  type: known_boundary
  evidence_class: stochastic_performance
  observation: Rolemaster injury and spell-failure review showed that a mechanically coherent consequence can become a participation
    problem when its fictional recovery duration exceeds the campaign’s active cadence. Severe wounds can remain meaningful
    and specific without requiring full anatomical recovery time to equal total player inactivity; the relevant design question
    is when meaningful participation returns and what campaign infrastructure makes that consequence playable. Cyberpunk 2020
    medical recovery corroborated that long fictional consequences can create useful time and economic pressure while still
    becoming player-level TBMD when one character is sidelined; stabilization, recovery, and player participation therefore
    need separate evaluation.
  confidence: provisional
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Separating full fictional recovery from functional participation recovery allows serious long-term consequences
      to persist without accidentally removing a high-investment character from multiple expected sessions unless that absence
      is itself intended play.
  boundary: Observed in Rolemaster SS/FRP injury, healing, and spell-failure procedures and corroborated by practitioner rejection
    of campaign-disrupting recovery times; needs transfer testing in campaigns with deliberately different downtime cadences.
  evidence_count: 2
  evidence_events:
