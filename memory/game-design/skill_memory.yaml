- id: GAMEDESIGN_MEM_011
  scope_type: topic
  scope_id: serial_resolution_latency
  type: known_boundary
  evidence_class: stochastic_performance
  observation: 'A Rolemaster case study exposed a table-level burden that single-action
    analysis can miss: when each actor must serially perform several rolls, lookups,
    branches, and state updates, individually tolerable resolutions can multiply into
    long periods in which a player has no meaningful decision. Practitioner evidence
    from one four-player-plus-GM session reported roughly ten minutes between an early
    completed action and the next opportunity to act, which is useful evidence of
    possible round latency but not a universal timing claim about the system. Twilight:
    2000 Version 2.2 added a within-action variant: automatic-fire work can multiply
    by burst or projectile count even when the player made only one attack decision,
    so serial latency must also be checked inside one actor''s action.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Measuring Human Operations Per Resolution together with Time 
      Between Meaningful Decisions across a complete representative round will 
      expose serial throughput problems that isolated resolution tests miss.
  boundary: 'Observed in the Rolemaster SS review using source-grounded procedure
    tracing and one practitioner session report; needs timed transfer testing on additional
    systems and groups; transfer evidence now also includes Twilight: 2000 Version
    2.2 automatic fire.'
  evidence_count: 2
  evidence_events:
