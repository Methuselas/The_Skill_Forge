- id: GAMEDESIGN_MEM_002
  scope_type: topic
  scope_id: complexity_value
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'Complexity was most defensible in the analyzed systems when an added rule created a meaningful decision, useful
    consequence, or reusable capability. Placement and frequency materially changed that value: substantial opt-in complexity
    attached to new capabilities could be welcomed, while smaller mandatory complexity inserted into already-satisfactory
    high-frequency procedures was experienced as friction. GURPS added two further pressures: several individually conditional
    rules can become expensive when they activate together, and coherent simulation can still overtax humans when much of
    the work is arithmetic, lookup, dependency propagation, or state maintenance rather than decision-making. Rolemaster added
    a table-level scaling pressure: individually defensible choices and lookups became expensive when common-path procedures
    repeated serially across all actors, and rich critical outcomes continued to impose future state-maintenance and recovery
    work after the initial resolution ended. Twilight: 2000 added a further cadence boundary: genre-common automatic fire
    can be too expensive even when labeled a specialist mode, and one player decision can become a procedural hotspot when
    work scales per projectile rather than per decision. Cyberpunk 2020 added participation coverage as another complexity
    dimension: a subsystem can have excellent internal decision density yet impose excessive table cost when one specialist
    owns most decisions, and a good per-hit procedure can become expensive when automatic fire multiplies the consequence
    cadence. Shadowrun 4E added complexity relocation as a further distinction: frequent resolution could be made cheaper through
    a shared grammar, Device Rating, grunt compression, abstract chase ranges, and routine-action omission while the same design
    preserved rich consequence state. It also showed that cleaner interoperable subsystems can increase global integration work
    because more states cross domain boundaries even when each local procedure becomes easier.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Asking what each layer of complexity buys in play is a productive diagnostic for healthy versus unhealthy
      crunch.
  boundary: 'Verified in comparative analysis of active defense, vehicle rules, FrontierSpace action economy, legacy subsystem
    accretion, Zebulon’s resolution replacement versus additive equipment, historical Star Frontiers playtests, GURPS Fourth
    Edition, and Rolemaster SS/FRP common-path combat, maneuvers, magic, injury, and advancement; not yet calibrated against
    a new game designed from scratch; additionally verified against Twilight: 2000 1E/Version 2.2 survival, combat, vehicle,
    and medical procedures.'
