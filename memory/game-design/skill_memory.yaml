- id: GAMEDESIGN_MEM_013
  scope_type: topic
  scope_id: state_granularity_vs_process_granularity
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Twilight: 2000 1E and Version 2.2 produced comparable decision-relevant vehicle component states through very
    different procedures. 1E traced penetrating energy through internal components, while Version 2.2 mapped penetration margin
    into categorical minor/major component results. The later procedure retained differentiated persistent state with substantially
    less causal-resolution work. Cyberpunk 2020 FNFF corroborated that useful output detail need not require equivalent state
    depth: hit location can route armor and limb consequences while a global wound track carries overall injury, yet multi-hit
    automatic fire can still multiply the consequence procedure beyond the efficient single-hit case. Shadowrun 4E transferred
    the principle across unrelated subsystems: burst fire compressed many bullets into one attack while preserving armor, damage
    type, wounds, knockdown, and healing state; chase combat compressed continuous geometry into engagement ranges while preserving
    ramming, escape, and passenger decisions; Device Rating compressed unimportant networked electronics while leaving important
    nodes fully specified. The recurring lesson is to compress process before consequence when consequence state drives later play.'
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Separating output-state granularity from causal-procedure granularity helps preserve simulation consequences
      while reducing operator burden.
