- id: GAMEDESIGN_MEM_001
  scope_type: topic
  scope_id: mechanical_architecture
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: Across multiple system teardowns, designs that reused a small mechanical vocabulary across many situations
    were easier to explain, compare, and extend than designs that required unrelated resolution families or conversion
    rules between subsystems. In established systems, preserving a familiar high-frequency resolution grammar also
    reduced migration and relearning cost. GURPS further showed that shared primitives can reduce fragmentation
    while increasing interaction density when many conditional modules feed the same resources and derived values,
    and that a later edition can substantially improve that architecture without materially repositioning the underlying
    play experience.
  confidence: repeated
  status: active
  diagnosis:
    failure_layer: training
    hypothesis: Reusable primitives reduce interface cost between subsystems while still allowing local specialization.
  boundary: Verified while analyzing Palladium Fantasy, Rifts Ultimate, Star Frontiers Alpha Dawn, FrontierSpace,
    Zebulon’s Guide, a historical Star Frontiers redesign prototype, and GURPS Fourth Edition Basic Set; not yet
    tested through original system construction from a blank foundation.
  evidence_count: 6
