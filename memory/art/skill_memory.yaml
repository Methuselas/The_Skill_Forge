- id: ART_MEM_011
  scope_type: topic
  scope_id: blind_drill_tranche_2
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Twenty valid one-shot Art Drill executions produced ten strict passes and
    ten strict failures after teacher review. Strongest areas were cranial rotation, perspective-field
    correction, tonal planning, changing light and atmosphere, palette derivation, competitive
    cover testing, and product-form ideation. Failures concentrated in temporal locomotion
    structure, human and animal limb-chain integrity, prescribed multi-pass information ceilings,
    exact cylinder construction, and isolated depth-cue separation. Partial results were kept
    as failures when any required component failed.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'The library contracts generally discriminated successful artifacts from near
      misses. Remaining failures were mostly execution and verification failures under one-shot
      generation rather than missing card knowledge. One expression-set Drill exposed a separate
      card-contract issue because its mirror-observation premise was not literally executable.

      '
  boundary: 'Covers one preregistered twenty-Drill blind tranche using native one-shot image
    generation and teacher review. It does not establish deterministic performance, long-term
    retention, or transfer to hand-drawn animation timelines. The expression-set card repair
    remains unimplemented pending canon review.

    '
