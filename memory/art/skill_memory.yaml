- id: ART_MEM_007
  scope_type: topic
  scope_id: multi_pass_construction_process_fidelity
  type: known_boundary
  evidence_class: stochastic_performance
  observation: 'Native multi-panel generation repeatedly collapses later information into
    earlier construction passes. A tiger''s first study already contained contour and volume;
    a four-way foreshortened figure did not prove that each image was independently built
    through the required sequence; and two later quadruped sheets placed mass and contour
    into studies that were supposed to remain skeletal or stripped down. Attractive final
    studies therefore do not establish process fidelity.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'Native multi-panel image generation tends to satisfy the overall concept
      by repeating a coherent, attractive subject treatment across panels, even when each
      panel has a different information ceiling. Later contour, mass, or tone can leak backward
      into the scaffold or isolation pass.

      '
  boundary: 'Verified across four blind multi-panel executions: one tiger construction progression,
    one foreshortened-figure treatment comparison, and two quadruped framework-to-mass studies.
    This boundary concerns prescribed pass separation, not the visual quality of the final
    subject.

    '
