- id: ART_MEM_010
  scope_type: topic
  scope_id: fixed_subject_comparison_control
  type: training_result
  evidence_class: stochastic_performance
  observation: 'The blind tranche showed strong control when one subject or display field
    had to remain fixed while a large variable changed: spacing profiles, perspective-field
    correction, tonal key, light and atmosphere, palette ancestry, and competitive title hierarchy
    all produced useful comparisons. The main exception was depth-cue isolation, where value,
    color, and detail leaked into an overlap-and-scale pass and the detail-simplification
    pass changed too little.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'Large, visually explicit comparison variables are preserved reliably when
      the invariant scene is strongly specified. Subtle isolation instructions are more vulnerable
      to cross-panel leakage than broad changes in key, weather, palette, crop, or typographic
      hierarchy.

      '
  boundary: 'Verified across seven blind comparison Drills in one tranche. One timing comparison
    retained residual uncertainty because the interface did not permit timeline scrubbing,
    and the depth-cue result was only a half-pass.

    '
