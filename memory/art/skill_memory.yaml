- id: ART_MEM_004
  scope_type: topic
  scope_id: stage4_finished_pencil_resolution
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Repeated Stage 4 attempts under the pre-repair source advanced pencil activity
    without reliably closing Drawing decisions: graphite, hatch, detail, and local cleanup
    increased while provisional contours, redundant marks, and under-resolved hierarchy remained.
    Direct human teaching that Finished Pencils is a resolved Drawing state, that approved
    Stage 3 decisions should be preserved rather than provisional Stage 3 marks, and that
    pencil style or density does not itself define completion produced a materially improved
    warm retry. After the bounded source repair, a context-exposed retest passed strongly
    and a genuinely clean fresh-chat retest also passed without renewed teaching. The historical
    more-graphite-equals-more-finished failure was not reproduced, supporting fresh-chat retention
    of the repaired Stage 4 closure behavior.

    '
  diagnosis:
    failure_layer: orchestration
    hypothesis: 'The earlier Stage 4 terminal threshold and positive calibration were too
      permissive, allowing Stage 3 plus additional pencil activity to pass as completion.
      The repaired contract now emphasizes decision closure under exact predecessor continuity,
      preserves approved decisions rather than exploratory marks, avoids one universal mark-density
      target, and keeps separately owned Rendering and downstream medium work outside universal
      Drawing Stage 4.

      '
  boundary: 'Verified on repeated Broken Gate registered-successor Stage 3 to Stage 4 runs,
    including one genuinely fresh clean-chat retention test after source repair. The warm
    and clean successful artifacts used somewhat different pencil expressions while both closing
    Drawing. Cross-subject transfer and broad successor-aware variants remain separate future
    questions.

    '
  confidence: strong
  status: resolved
