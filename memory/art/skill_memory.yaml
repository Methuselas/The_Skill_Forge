- id: ART_MEM_012
  scope_type: topic
  scope_id: perspective_in_composition
  type: known_boundary
  evidence_class: deterministic_contract
  observation: 'Teacher review and valid perspective-drill failures establish a hard runtime
    boundary: when rendered art depends on spatial depth, scale, or viewpoint, unresolved
    perspective can invalidate the entire composition even when the surface artifact looks
    plausible or polished. Perspective also changes narrative and emotional force through
    viewpoint, not only geometric realism.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'The runtime can produce plausible surface composition before solving a shared
      eye-level, vanishing-point, and ground-plane field, allowing local forms and rendering
      to mask perspective errors.

      '
  boundary: 'Verified by direct teacher instruction and three valid perspective observations:
    incorrect eye-level/vanishing-point relationships in box studies, an unvalidated shared
    perspective field in a scene, and a corrected perspective study that still requires explicit
    field validation. Corrected perspective-first execution, retention, and transfer have
    not yet been tested.

    '
