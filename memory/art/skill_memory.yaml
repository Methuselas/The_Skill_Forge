- id: ART_MEM_003
  scope_type: topic
  scope_id: terrain_mesostructure
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'In landscape work the large terrain silhouette and broad light/shadow separation
    survive to the finished image, while meso-scale structure - ridges, plane changes, fractures,
    erosion pattern - thins out before atmosphere and surface finish are applied.

    '
  diagnosis:
    failure_layer: orchestration
    hypothesis: 'The working sequence applies atmospheric reduction before meso-scale terrain
      structure has been verified, so the reduction removes structure that was never established.

      '
  boundary: 'Observed on observational/painterly landscape work. Not tested on architectural
    or figure subjects, and not retested after any sequence change.

    '
