- id: ART_MEM_014
  scope_type: topic
  scope_id: thumbnail_camera_and_scale
  type: training_result
  evidence_class: stochastic_performance
  observation: 'Fixed-scene camera thumbnails remain useful when the story design is locked and
    each view changes the camera meaningfully across lateral side, height, distance, tilt, or
    framing. Distinct views can tell different stories without redesigning the scene. Changing
    medium or mark language from broad marker to graphite pencil can also change mood and
    expression while preserving the same camera and design. A thumbnail is an essence capture,
    not a final render; its composition, silhouette, value grouping, focal point, and story must
    survive reduced-size viewing.'
  diagnosis:
    failure_layer: application
    hypothesis: 'The runtime can overvalue enlarged surface finish and underweight the small-view
      test. Treating thumbnail quality as dependent on a single roughness level can obscure that
      camera search, continuity, mark language, and reduced-size readability are separate controls.'
  boundary: 'Verified across fixed-scene marker and pencil camera sets reviewed by the teacher.
    A 600x900 pixel target at 300 DPI is a useful practical 2x3 inch scale, but exact raster size
    and the broader transfer to every thumbnail subject remain untested.'
  confidence: repeated
  status: monitoring
