- id: ART_MEM_001
  scope_type: topic
  scope_id: hands_and_object_contact
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Across earlier character renders and isolated hand benchmarks, individual
    hands repeatedly failed through extra or missing digit chains, broken palm roots, thumb/finger
    identity substitution, occlusion deleting anatomy, and mechanically incoherent configurations.
    After the topology-first root-map and deepest-to-nearest construction intervention, performance
    improved to a provisional 28/30 no-object isolation retest, 14/15 on an extreme hand-plus-forearm
    test, and 14/15 in a fresh chat with no renewed hand coaching. Cold full-production renders
    preserved hand topology under strong figure, costume, perspective, environment, and rendering
    load. A later portable-Skill-only full-production support pose also preserved coherent
    hand topology and convincing body-support contact/load behavior even though that Skill
    release did not contain the Art Memory files, providing evidence that the canonical hand
    intervention itself can transfer independently of Memory retrieval. A later blind hand/foot
    wedge study again omitted required topology in two views, confirming that residual missing-digit
    failures remain possible, and one cold firearm render showed a separate function/contact/load
    failure despite broadly coherent hand topology.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'The topology-first root map plus deepest-to-nearest complete-chain route
      materially reduces the earlier extra/missing/root-failure classes, and the improvement
      now survives fresh-chat retention, full-production load, and at least one portable-Skill
      execution without Art Memory. Remaining topology misses are best treated as residual
      stochastic application/verification failures rather than proof that the current hand
      canon is underspecified. Object-constrained actions remain a distinct vulnerability:
      a topologically valid hand can still fail palm seating, digit wrap, thumb opposition,
      contact, or load/control semantics, although the later nonweapon body-support example
      provides positive transfer evidence for support/contact/load behavior outside the earlier
      firearm case.

      '
  boundary: 'Verified on ordinary human hands across no-object isolation, varied-angle grips,
    extreme hand-plus-forearm foreshortening, fresh-chat retention, cold full-character production,
    and one portable-Skill-only full-production body-support case without Art Memory. The
    topology intervention has improved and retained across chats and package conditions, but
    it is not deterministic; a later blind construction sheet missed topology in a side hand
    and an up-view hand. Nonweapon support/contact/load behavior now has one strong positive
    full-production example, while broader object-contact/function transfer remains partial
    because the earlier cold firearm-grip failure is still valid. Character-specific nonhuman
    topology and broader weapon/tool contact classes have not been retested to the same depth.

    '
