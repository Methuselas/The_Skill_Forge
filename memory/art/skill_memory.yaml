- id: ART_MEM_006
  scope_type: topic
  scope_id: limb_chain_mechanics
  type: known_boundary
  evidence_class: deterministic_contract
  observation: 'Multiple executions now show that a visually connected limb or terminal endpoint
    does not prove a valid articulated chain. A high-load human render reversed a knee/lower-leg
    relationship; a blind hidden-limb sheet allowed shoulder-origin chains to terminate as
    feet; a change-direction pose turned one leg against the hips and torso beyond a believable
    limited separation; and one quadruped construction omitted the bear''s femur.

    '
  diagnosis:
    failure_layer: orchestration
    hypothesis: 'Connectedness and silhouette plausibility can be accepted before parent origin,
      ordered segment identity, endpoint type, and joint range are each checked. The failure
      can therefore survive in both human and animal studies even when the overall pose or
      skeleton looks good.

      '
  boundary: 'Verified across one extreme full-body human render and three blind Drill executions
    covering human direction change, hidden human limbs, and ordinary quadruped construction.
    The current audit contract correctly rejects these failures, but stochastic generation
    still produces them. Nonhuman altered-joint architectures remain outside this evidence
    claim.

    '
  confidence: repeated
  status: monitoring
