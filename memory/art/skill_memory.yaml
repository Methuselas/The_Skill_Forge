- id: ART_MEM_005
  scope_type: runtime
  scope_id: registered_successor_continuity
  type: known_boundary
  evidence_class: stochastic_performance
  observation: In a fresh hard-locked Broken Gate Stage 3 to Stage 4 run using the optimized
    portable Art Skill and the exact canonical predecessor, the native generative image operation
    preserved the approved scene at the decision and structural level and produced valid Finished
    Pencils, but it still re-synthesized local topology. Wheel spokes and hub construction,
    broken plank endpoints, individual rubble shapes, stair damage, masonry cracks, costume
    microstructure, facial microstructure, and other secondary details changed into similar-but-different
    equivalents despite explicit continuity locks.
  diagnosis:
    failure_layer: tool
    hypothesis: The native whole-image generative successor operation can follow semantic
      and structural predecessor constraints but is not deterministic at local raster/topology
      level. Hard-lock prose can reduce decision drift, but it cannot guarantee exact local
      preservation when the host operation re-synthesizes the frame rather than exposing an
      enforceable exact-edit lineage.
  boundary: Verified on the canonical Broken Gate registered-successor Stage 3 to Stage 4
    task in a fresh chat with the optimized portable Skill, exact predecessor, and explicit
    hard locks. This does not establish the same limitation for future hosts or operations
    that expose deterministic masked editing, compositing, or mechanically verifiable exact-predecessor
    lineage.
  confidence: provisional
  status: monitoring
  evidence_origin:
  - runtime_self_audit
  - user_feedback
  - training_benchmark
