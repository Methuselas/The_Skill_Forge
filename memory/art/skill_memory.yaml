# Compact current empirical state for the Art lane. Contract:
# PASS/docs/MEMORY_SCHEMA.md. This file is not canon and never becomes canon by
# being copied into a card; a lesson that seems to belong everywhere has earned
# promotion review instead.
#
# Seeded conservatively from pre-Memory practical runs. Every entry below is a
# craft observation from a run that was a valid test of the thing it describes.
# Controller, tool, packaging, and reference-routing failures from the same
# period are deliberately absent: those were not tests of craft, and several are
# now held by regression tests where they belong.

entries:
  - id: ART_MEM_001
    scope_type: topic
    scope_id: hands_and_object_contact
    type: recurring_failure
    evidence_class: stochastic_performance
    observation: >
      Across earlier character renders and isolated hand benchmarks, individual
      hands repeatedly failed through extra or missing digit chains, broken palm
      roots, thumb/finger identity substitution, occlusion deleting anatomy, and
      mechanically incoherent configurations. After the topology-first root-map
      and deepest-to-nearest construction intervention, performance improved to a
      provisional 28/30 no-object isolation retest, 14/15 on an extreme
      hand-plus-forearm test, and 14/15 in a fresh chat with no renewed hand
      coaching. Cold full-production renders preserved hand topology under strong
      figure, costume, perspective, environment, and rendering load. Residual
      topology misses remain possible, and one cold firearm render showed a
      separate function/contact/load failure despite broadly coherent hand
      topology.
    diagnosis:
      failure_layer: application
      hypothesis: >
        The topology-first root map plus deepest-to-nearest complete-chain route
        materially reduces the earlier extra/missing/root-failure classes, and the
        improvement now survives fresh-chat retention and full-production load.
        Remaining topology misses are best treated as residual stochastic
        application/verification failures rather than proof that the current hand
        canon is underspecified. Object-constrained actions remain a distinct
        vulnerability: a topologically valid hand can still fail palm seating,
        digit wrap, thumb opposition, contact, or load/control semantics.
    boundary: >
      Verified on ordinary human hands across no-object isolation, varied-angle
      grips, extreme hand-plus-forearm foreshortening, fresh-chat retention, and
      cold full-character production. The topology intervention has improved and
      retained across chats, but it is not deterministic. Object-contact/function
      transfer remains partial after one cold firearm-grip failure. Character-
      specific nonhuman topology and broader object-contact classes have not been
      retested to the same depth.
    confidence: repeated
    status: monitoring
    evidence_count: 10
    evidence_events:
      - ART_EV_0001
      - ART_EV_0004
      - ART_EV_0005
      - ART_EV_0006
