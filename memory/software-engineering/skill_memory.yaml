- id: SE_MEM_010
  scope_type: topic
  scope_id: stopping_one_sentence_before_the_conclusion
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Across eleven drills run blind, with answers written to a file before any
    success check was opened, eight scored clean and three fell short, and the three failed
    identically. One drill required the run to end in a verdict about the structure examined,
    and the run ended at the last finding instead. One required naming an identifier that
    would have been accepted had it been read in place, and the identifier was flagged without
    that observation being written. One required naming a metaphor whose implied model had
    not previously been made explicit, and two qualified while neither was marked. In every
    case the analysis underneath was present and correct, and only the closing statement was
    missing.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'A request to state what an exercise revealed is being read as a summary of
      the work rather than as a further output, so once the work is done the requirement looks
      already satisfied and the run stops. The three checks that failed all ask for a claim
      that is not derivable from the analysis by a reader - a verdict, an admission about
      what would have passed in context, a note that a model was newly explicit - and each
      of those is a fact about the run rather than about the subject. That is why the omission
      is invisible on inspection: the answer reads as finished because everything it contains
      is correct, and nothing marks the place where the missing sentence would have gone.
      The operational form is to treat any check phrased as what this revealed, or what you
      now conclude, as a required output with its own line, written before the run is considered
      done.

      '
  boundary: 'Seven sightings within one session, all by one runtime, all against drills in
    the software engineering lane, and all self-graded against the drills'' own success checks
    rather than by an independent reader. The four later sightings came from drills whose
    checks this runtime did not write, which removes the obvious objection to the first three,
    that the checks were failed because their author had made them demanding. Two of the three
    were checks asking for self-observation and one asked for a verdict about an artifact,
    so whether these are one tendency or two is not settled by what has been seen. A third
    form has since appeared and behaves like the same thing: offering a prediction where the
    check asked for a performance, a repetition described rather than run, a distinction asserted
    rather than drawn. Not observed outside drills: no instance has been identified in produced
    code, in card authoring, or in corpus review, and the eight clean runs all had checks
    that asked only for the analysis, so the entry currently distinguishes what is asked for
    rather than what the runtime can do. Untested on whether naming the requirement in advance
    prevents it, which is the obvious next probe and has not been run.

