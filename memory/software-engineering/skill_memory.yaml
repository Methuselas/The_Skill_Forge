    failure_layer: tool
    hypothesis: 'A review that cannot execute is limited to claims a careful reader can be
      talked out of, and the strongest findings are exactly the ones that sound implausible
      until they run. Reproduction also changes what the reviewer will commit to: a defect
      described as likely gets softened, and the same defect with an observed output attached
      does not. The cost is small once the invocation is known, which is why the invocations
      belong in this entry rather than being rediscovered.

      '
  boundary: 'Verified on this machine only, and the invocation paths are specific to it. The
    MSVC route needs its include and library paths supplied by hand because the usual environment
    script is broken on the Visual Studio install present here, so a different machine will
    need that part re-established rather than copied. Go and Rust were installed without modifying
