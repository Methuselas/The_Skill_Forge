- id: SE_MEM_004
  scope_type: topic
  scope_id: establishing_a_rules_precondition_before_judging_compliance
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    Judging a benchmark against a card that prescribes how the code under test must be
    compiled, the runtime read the benchmark file, saw the prescribed precaution absent,
    and was ready to report a violation. The fact that decided the question was in another
    file: the code under test is a forced-inline template in a header, so the shipping
    build specializes it exactly as the fixture does, and applying the precaution would
    have measured a binary nobody ships. The card named a mechanism rather than the goal
    the mechanism serves, which is a separate defect and was repaired; what this entry
    records is that the compliance judgement was made before the fact that decides it had
    been located, and that nothing in the reviewed file signalled the fact was elsewhere.
  diagnosis:
    failure_layer: application
    hypothesis: >
      A rule about how code is built, deployed, or called has a precondition that lives
      where the code is defined or invoked, not where the rule is being applied. The
      reviewed file is the salient one and reads as complete, so the precondition gets
      assumed rather than checked. The cost of checking is one file open, and the failure
      is silent in both directions - the rule can appear violated when it is satisfied, or
      satisfied when it is violated.
  boundary: >
    Observed once, on a compilation-context rule applied to a benchmark. SE_MEM_002 in
    this file records the same shape a run earlier, on an error-signalling inconsistency
    whose deciding fact was a layer boundary; the two share a hypothesis and not an
    observation. Untested on rules about lifetime, ownership, and thread confinement,
    where the deciding fact is also routinely outside the reviewed file.
  confidence: provisional
  status: active
  evidence_count: 1
  evidence_events:
  - SE_EV_0002
  evidence_origin:
  - runtime_self_audit
  retrieval_cues:
  - how is this compiled
  - inline
  - benchmark fixture
  - where is this called from
  - the rule applies here
  - judging compliance
  - reviewing one file
  last_verified: '2026-08-28'
- id: SE_MEM_005
  scope_type: topic
  scope_id: reporting_a_guidance_defect
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    Across two review runs the runtime reported eight defects in cards. Five survived
    verification against the owning card and three did not. One card's IF already covered
    the case and what had failed was routing; a second card's Do already described the
    failure mode and again only routing had failed; a third card's rule already admitted
    the form being asked for, so the report was a preference rather than a defect. Every
    one of the three was caught by reading the owning card in full before editing, and
    none was caught by the reasoning that produced the report. In the second run the two
    unverified reports were the two cards the report itself had flagged as consulted by
    index entry rather than read.
  diagnosis:
    failure_layer: application
    hypothesis: >
      A card that did not fire during a review is indistinguishable at the time from a
      card that could not have fired, because both present as silence. The reviewer
      attributes the silence to the card's wording, which is the visible candidate, when
      the more common cause is that the card was never reached. Reading the owning card in
      full separates them, and the correlation between not reading a card and misreporting
      it held on every instance so far.
  boundary: >
    Eight reports across two runs on one codebase, by one reviewer against one library.
    The survival rate is not a stable figure and should not be treated as one. What is
    verified is the direction - reported defects over-count - and that full reading of the
    owning card is what separated the two kinds. Untested on reports of missing cards
    rather than defective ones, and untested on whether a reviewer who reads every
    candidate owner in full still over-reports.
  confidence: repeated
  status: active
  evidence_count: 2
  evidence_events:
  - SE_EV_0001
  - SE_EV_0002
  evidence_origin:
  - runtime_self_audit
  - user_feedback
