- id: SE_MEM_004
  scope_type: topic
  scope_id: establishing_a_rules_precondition_before_judging_compliance
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Judging a benchmark against a card that prescribes how the code under test
    must be compiled, the runtime read the benchmark file, saw the prescribed precaution absent,
    and was ready to report a violation. The fact that decided the question was in another
    file: the code under test is a forced-inline template in a header, so the shipping build
    specializes it exactly as the fixture does, and applying the precaution would have measured
    a binary nobody ships. The card named a mechanism rather than the goal the mechanism serves,
    which is a separate defect and was repaired; what this entry records is that the compliance
    judgement was made before the fact that decides it had been located, and that nothing
    in the reviewed file signalled the fact was elsewhere.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'A rule about how code is built, deployed, or called has a precondition that
      lives where the code is defined or invoked, not where the rule is being applied. The
      reviewed file is the salient one and reads as complete, so the precondition gets assumed
      rather than checked. The cost of checking is one file open, and the failure is silent
      in both directions - the rule can appear violated when it is satisfied, or satisfied
      when it is violated.

      '
  boundary: 'Observed twice, on two codebases: once on a compilation-context rule applied
    to a benchmark, once on an AP branch asking whether a component should exist. SE_MEM_002
    in this file records the same shape a run earlier, on an error-signalling inconsistency
    whose deciding fact was a layer boundary; the three share a hypothesis and not an observation.
    The second sighting widens the entry from rules about how code is built to any judgement
    whose deciding fact lives at the call sites, which is the larger class. Untested on rules
    about lifetime, ownership, and thread confinement, where the deciding fact is also routinely
    outside the reviewed file.

    '
  confidence: repeated
  status: active
  evidence_count: 2
  evidence_events:
  - SE_EV_0002
  - SE_EV_0003
  evidence_origin:
  - runtime_self_audit
