- id: SE_MEM_006
  scope_type: topic
  scope_id: reporting_that_no_card_owns_a_situation
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    Reviewing a codebase against the library and asked to report both what fired and what
    nothing owned, the runtime twice moved to file an unowned observation under a card whose
    subject was adjacent but different, and in each case the attribution would have been
    accepted by a later reader. A control construct that claimed more control flow than the
    code performed was about to be filed under a card on nesting depth, which its one level
    of nesting did not engage. A design choice a card could neither condemn nor certify was
    about to be filed as that card disapproving of it, on the strength of the card's silence.
    Both were caught only by asking what the candidate card's subject actually was, rather
    than whether the observation could be made to sit under it. An observation with a card
    attached reads as a stronger finding than one without, so the pull is toward attributing;
    every forced attribution converts a gap report into a finding and leaves the gap
    unrecorded, which is the more expensive of the two errors because a missing card leaves
    no trace anywhere else.
  diagnosis:
    failure_layer: application
    hypothesis: >
      Reporting that nothing owns a situation feels like a weaker claim than naming an
      owner, and it is also more work, because it has to be backed by saying what was
      searched. The library is large enough that some card is nearly always close enough to
      cite, and closeness is judged by whether the observation can be phrased in the card's
      vocabulary rather than by whether the card's subject is the thing observed. The check
      that separates them - state the candidate's subject in one sentence without mentioning
      this code, then ask whether the observation is an instance of that - is cheap and was
      not part of the reviewer's default sequence.
  boundary: >
    Observed twice within one run on one codebase, on a readability observation and a design
    observation, both against core Patterns. Caught before reporting on both occasions, so
    what is recorded is the pull rather than a delivered error. The inverse of SE_MEM_005,
    which records the same reviewer over-reporting defects in cards that were reached; this
    entry records under-reporting gaps in regions no card covers, and the two have not been
    seen in the same region. Untested against APs and Drills, untested on whether a reviewer
    not explicitly asked for unowned situations reports them at all, and untested on whether
    the one-sentence subject check actually prevents it.
  confidence: provisional
  status: active
  evidence_count: 1
  evidence_events:
  - SE_EV_0003
  evidence_origin:
  - runtime_self_audit
