- id: SE_MEM_001
  scope_type: topic
  scope_id: applying_a_card_condition
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    Reviewing found C++ code against the library, the runtime read a Pattern's ELSE
    clause as permission to stop rather than as a claim to verify, and came within one
    checklist question of clearing an out-of-bounds loop the same card exists to catch.
    The clause excused an index "derived from the container's own size"; the loop's bound
    was a named constant that equalled the container's size, which satisfied the clause as
    written. The same run met a second card whose option list omitted the option the code
    had actually taken, with the same effect - the rule appeared not to apply. In both
    cases the IF and the THEN were correct and the narrowing sat in the clause that says
    when the rule does not apply. Seen again on a second codebase region, against two
    different cards and in both of the same two forms. A variant permitting a check that
    compiles out was read as permitting a weaker contract, and the runtime came within one
    step of clearing a documented precondition that admitted the single value which writes
    out of bounds - the obligation that variant attaches, that the contract be written
    precisely enough for a caller to tell whether they satisfy it, was the part the code
    failed and the part not read. Separately an option list of three enforcement mechanisms
    was run to completion and one was selected, when the correct answer was that none
    applied: the list presupposes a validation boundary and the code had none.
  diagnosis:
    failure_layer: application
    hypothesis: >
      Escape clauses and option lists are read as closed and authoritative because the
      rule above them is. They are the part of a card most likely to have been written
      against the author's examples rather than against unfamiliar code, so they are where
      a correct rule silently narrows - and the reader has no signal that a clause is
      approximate rather than exhaustive.
  boundary: >
    Observed twice, in two runs over the same large codebase, against four Patterns in
    total - two in the C++ package and two in core. The offending clauses were repaired in
    canon after each run, so this entry is about the reading habit that nearly missed them
    rather than about those cards. Both sightings came from the same reviewer reading the
    same library, so this is repeated behaviour and not yet a cross-reader result. Still
    untested on APs and on Drills, and untested on whether reading the card body in full
    prevents it or merely caught it these two times.
  confidence: repeated
  status: active
  evidence_count: 2
  evidence_events:
  - SE_EV_0001
  - SE_EV_0002
  evidence_origin:
  - runtime_self_audit
