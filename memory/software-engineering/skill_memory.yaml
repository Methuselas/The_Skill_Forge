- id: SE_MEM_008
  scope_type: topic
  scope_id: checking_invariants_at_runtime
  type: known_boundary
  evidence_class: stochastic_performance
  observation: >
    Five C++ corpora were measured for assertion density, comment density and
    discard-warning usage: two human-written from a 2001 commercial game, one agent-written
    layer inside that same repository, and two agent-written subsystems from a separate
    project. The human corpora carry 5.0 and 6.0 assertions per thousand code lines. The
    agent layer beside them carries 9.8 - roughly twice the human rate. The two subsystems
    in the other project carry zero, across sixty-five thousand lines, with no assertion
    macro defined or used anywhere and the standard assert header never included. Comment
    density spans 0.033 to 0.596 across the five, and the two agent projects sit at opposite
    ends of that range. On every metric measured, the gap between the two agent-written
    projects is larger than the gap between agent and human code. There is no single agent
    signature in this data.
  diagnosis:
    failure_layer: knowledge
    hypothesis: >
      What varies is not the writer but the guidance the project was written against. The
      project with zero assertions was built against an earlier library generation whose
      invariant object stated a correct rule above a body shared verbatim with 189 other
      objects and naming no mechanism at all - no runtime check, no debug-build loudness.
      That library held 261 distinct guidance bullets across 325 objects; the current one
      holds 6,192 across 500 with no prose bullet repeated in ten or more files. If the
      hypothesis holds, guidance density is not a quality-of-writing matter but the thing
      that decides whether a mechanism appears in produced code at all, and that is a claim
      about the library rather than about the runtime.
  boundary: >
    Two agent projects and one human project, so two samples of the thing that matters and
    no control over domain, agent mix, calendar time, UI framework, or which guidance each
    project used - the last of which is the proposed cause and is confounded with everything
    else. The zero-assertion project is simultaneously the highest scorer on compile-time
    discard warnings of any corpus measured, so it is not uniformly weaker; it pushed
    enforcement to compile time and has none at run time. Counts come from regular
    expressions, not a parser. An earlier pass of this same measurement reached the opposite
    conclusion by counting implementation files only, which sampled under a tenth of the
    agent renderer, so any re-measurement must include headers. Untested outside C++, and
    untested against a corpus written under the current library, which is the sample that
    would actually test the hypothesis.
  confidence: provisional
  status: monitoring
  evidence_count: 1
  evidence_events:
  - SE_EV_0005
  evidence_origin:
  - runtime_self_audit
  likely_owners:
  - PAT_enforce_contracts_at_runtime_with_loud_checks
  - PAT_make_the_development_build_fail_louder_than_production
  - PAT_fail_fast_near_error_source
