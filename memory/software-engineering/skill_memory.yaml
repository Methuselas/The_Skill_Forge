- id: SE_MEM_015
  scope_type: runtime
  scope_id: findings_can_be_executed_not_only_argued
  type: successful_tendency
  evidence_class: deterministic_contract
  observation: 'Four language toolchains are available on this machine and each has been verified
    by compiling and running a program, not by finding the binary. C and C plus plus through
    the MSVC compiler in the Build Tools install, invoked directly with explicit include and
    library paths because the environment batch file on the neighbouring Visual Studio install
    fails. Python through the interpreter already used for every tool in this repository.
    Go and Rust downloaded from their official distributions, checksums checked against the
    published values before anything was extracted or executed, and installed under one directory
    with no change to the system path. Three review findings moved from argued to reproduced
    once a compiler was in hand: a monetary total that prints negative for a sum of positive
    inputs, an emptiness accessor whose guard dereferences an empty container in one direction
    and returns a sentinel forever in the other, and a compiler diagnostic naming the narrowing
    that caused the first.

    '
