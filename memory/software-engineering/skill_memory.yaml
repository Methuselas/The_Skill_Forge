- id: SE_MEM_016
  scope_type: ap
  scope_id: AP_review_code_you_did_not_write
  type: known_boundary
  evidence_class: stochastic_performance
  observation: 'Two runs of the review protocol covered the same five hundred and fifty line
    slice independently, and the second found three defects the first had missed. All three
    sat in lines the first run had read: a reset path clearing five of six fields, a load
    path omitting a range check the same class enforces on every daily advance, and a guard
    set of three conditions admitting a negative amount and creating money and debt together.
    What none of the three could be settled by was the file itself - each needed the data
    files that feed the load, the collaborating class that consumes the value, or the callee''s
    discarded return value and the single caller that compensates for it. The first run stopped
    at the file boundary and carried out the protocol''s ranking step anyway, which asks what
    each defect can break, so the ranking rested on argument and nothing in the report it
    produced distinguished that from a ranking established from call sites. Two controlled
    experiments have since failed to identify what produces the outward trace when it does
    happen. Removing the memory store from a reviewer''s entrypoint did not stop it. Removing
    the protocol''s ranking-by-reach instruction from all four places it appears did not stop
    it either, and in that comparison the withheld arm, asked only to state whatever ordering
    principle it had used, chose the gap between what a caller asked for and what they got.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'The sighting is not in doubt and the mechanism offered for it still fits.
      Staying inside the file does not hide the anomalies; it removes the only thing that
      separates an anomaly from a decision somebody made on purpose, and the ranking step
      is where that costs something, because severity is the one output that can be argued
      plausibly from the code alone, so an under-scoped review still emits a ranked list and
      reads as complete. What has failed is every attempt to name a cause that can be acted
      on. Retrieval was credited on the strength of four self-reports by the runtime whose
      behaviour was in question, and twice failed to reproduce under manipulation. Two candidates
      remain unexcluded: the protocol''s first step, which asks what the code owns, what it
      promises callers and what it assumes of them, and which was left standing in both experiments;
      and a clause in every prompt describing the reviewed code as a published unit with consumers
      outside the tree, which was never controlled. Until one of those is tested, the position
      this entry supports is that a review sometimes stops at the file boundary, that this
      is worth knowing because the resulting report looks finished, and that nothing here
      is known to prevent it.

      '
  boundary: 'Evidenced by one comparison: two independent runs of one protocol over the same
    unchanged code, which is what separates it from two differing opinions. The under-scoped
    run was on a single class in a long-lived multi-author C plus plus project whose callers,
    data files and build settings all sit in the same tree, where tracing outward is cheap
    and terminates. Five events are cited and only one is a sighting. Two are ordinary runs
    in which this entry was retrieved and the failure did not occur, and two are controlled
    comparisons in which it was withheld by construction and the failure still did not occur.
    Read the count as one sighting and four non-recurrences, which is why this is recorded
    as a boundary rather than as a recurring failure; four citations otherwise invite the
    opposite reading. Probed once where the slice is a published library crate whose consumers
    sit outside the tree, which this boundary previously called untested and warned could
    licence an unbounded trace. It did not: that trace terminated in one search and four call
    sites, because establishing reachability needed only the in-tree consumers while the out-of-tree
    ones mattered for their existence rather than their contents. Untested, and these are
    the tests worth running: whether the protocol''s first step produces the outward orientation
    on its own, and whether a prompt that does not describe the reviewed code as published
    with outside consumers changes anything. Both were present in every run so far. Also untested
    is whether requiring reachability before the ranking step prevents the original miss,
    which is the one intervention nobody has tried. One caveat on provenance: the founding
    event was recorded by the run that missed the three defects and the entry was first written
    by the run that found them, so the diagnosis carries that interest even though the observation
    does not depend on it.

    '
