- id: SE_MEM_011
  scope_type: topic
  scope_id: how_a_card_fails_and_how_to_find_it_cheaply
  type: successful_tendency
  evidence_class: stochastic_performance
  observation: 'Reading the library''s cards against languages they were not written from
    produced four recurring defect shapes, and three of the four are visible in the card text
    alone. A universal IF paired with a THEN naming a mechanism only some languages have.
    An IF gated behind a construct the problem does not need, where stripping the construct
    word leaves the situation intact. Correct scoping, where the construct genuinely belongs
    in the IF and nothing needs changing. And a rule stating one way of satisfying a requirement
    as though it were the requirement, which reads as correct everywhere the named way happens
    to be available. Sweeps conducted by reading card text found defects at a small fraction
    of the cost of reading a corpus, and reached cards no corpus batch had covered because
    no corpus exercised that topic in a language lacking the mechanism. A flag raised by a
    sweep reliably identified where to look and was never once right about how much was wrong;
    every card read in full before editing turned out to need less than the flag implied.

    '
  diagnosis:
    failure_layer: knowledge
    hypothesis: 'A card is written from one source in one language, so whatever that language
      supplies is invisible to the author as an assumption. The dependence becomes findable
      because it has to surface somewhere in the rule, and where it surfaces decides whether
      the card is wrong: a mechanism named in the THEN is a defect, because the situation
      is universal and the remedy is not, while the same construct named in the IF may be
      correct scoping. The fourth shape is the same error one level up, a method standing
      in for a condition, and it is the hardest to see because the method works everywhere
      the author has been. The operational consequence is that a language the lane has never
      met is worth more per hour than another corpus in a language it knows, and that a defect
      shape once named converts into a reading sweep that costs almost nothing.

      '
  boundary: 'Four shapes drawn from repairs across C, C plus plus, Rust, Python and Go, most
    of them in the core package, and confirmed by a full reading sweep of the three hundred
    and twenty four core patterns carrying an IF and THEN rule. The reading sweeps are evidenced
    for shapes checkable from card text and say nothing about defects that need a corpus to
    reveal, which is a category this entry cannot see. A sharper limit has since been found:
    a reading sweep over every core pattern carrying a rule missed a card whose condition
    was gated on a class, because that card is correct for the case it describes and only
    its scope is narrow. Reading can separate a condition that is wrong from one that is right;
    it cannot separate a narrow condition from a correctly scoped one, because the two read
    identically in the card text and differ only in whether a case exists outside the stated
    scope. That case has to come from code, which makes the cheap sweep and the expensive
    corpus read complements rather than substitutes. Untested on the art and writing lanes,
    whose cards are not language-bound and where the shapes may have no analogue. The claim
    that a flag overstates severity rests on every occasion so far and has no counterexample
    yet, which is weaker evidence than it sounds because the same runtime both raised and
    cleared the flags.

    '
