- id: SE_MEM_007
  scope_type: topic
  scope_id: bounding_a_guarantee_by_what_the_inputs_do
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Asked to make a function exception-safe and offer the strongest practical
    guarantee, the runtime produced every structural remedy correctly - an RAII lock guard
    with copying suppressed, a smart-pointer member reset after the new resource is built,
    the counter incremented only after the operation that can throw, and a pimpl copy-and-swap
    for the strong guarantee. It also stated the correct general principle unprompted: a side
    effect that cannot be undone caps the guarantee at basic, and a function is only as exception-safe
    as the least safe function it calls. It then illustrated that principle with invented
    examples - a file written, another system notified - while the actual uncancellable side
    effect sat in the parameter list of the function under analysis, an input stream whose
    read position advances as the constructor consumes it and cannot be rewound after a throw.
    The function signature had been written out three times. What was scanned for rollback-ability
    was the object''s own member state; the parameters were not scanned at all.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'Exception-safety work presents as a question about the object being modified,
      because the remedies all operate on member state - reorder the members, wrap them, copy
      and swap them. That framing makes the members the search space and quietly excludes
      everything the function merely touches. An argument arriving by reference is state the
      function mutates just as surely as a member, and it is the one kind of state none of
      the structural remedies can restore. Knowing the principle is evidently not sufficient
      to run the search: the principle was stated correctly in the same answer that missed
      its instance.

      '
  boundary: 'Observed once, on a drill administered blind - the task was read, the answer
    written to a file, and only then the success criteria opened. Untested on real code rather
    than a drill, where a signature is longer and the offending parameter is less prominent,
    and untested on the other direction of the same search, where a function returns or stores
    a reference whose validity the guarantee depends on. Whether stating the principle first
    and then enumerating parameters against it prevents the miss is the obvious next probe
    and has not been run.

    '
  confidence: provisional
  status: active
  evidence_count: 1
  evidence_events:
  - SE_EV_0004
  evidence_origin:
  - runtime_self_audit
  likely_owners:
  - AP_make_a_function_exception_safe
