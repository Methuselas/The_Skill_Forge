- id: SE_MEM_002
  scope_type: topic
  scope_id: reading_inconsistency_in_unfamiliar_code
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    On finding one class that signalled errors two different ways - a modern result type
    on its internal methods and a bare boolean with out-parameters on its public surface -
    the runtime moved to report the inconsistency as a defect to be unified. The split
    followed a layer boundary exactly, the outer surface reproduced a fixed external ABI
    that the project exists to reproduce faithfully, and the finding would have been wrong.
    What separated the two readings was whether the inconsistency fell along a line or
    scattered; nothing else in the code distinguished them.
  diagnosis:
    failure_layer: application
    hypothesis: >
      Consistency rules are easy to apply from a diff-sized view, so an inconsistency
      registers as a finding before the question of what the boundary is has been asked.
      The check that separates the two cases - does the variation follow a line, and is
      that line a layer, a platform, or an external contract - is cheap and was not part
      of the reviewer's default sequence.
  boundary: >
    Observed once, on error-signalling style in a codebase reimplementing a documented
    external API. Untested on naming, formatting, and structural inconsistency, and
    untested where no external contract is present to explain the split.
  confidence: provisional
  status: active
  evidence_count: 1
  evidence_events:
  - SE_EV_0001
  evidence_origin:
  - runtime_self_audit
  likely_owners:
  - PAT_settle_one_error_handling_strategy_systemwide
