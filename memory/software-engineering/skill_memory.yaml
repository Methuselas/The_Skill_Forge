- id: SE_MEM_017
  scope_type: topic
  scope_id: drill_instructions_against_their_own_success_check
  type: known_boundary
  evidence_class: deterministic_contract
  observation: 'Three drills were taken with only their front matter, task, setup and instructions
    visible, answered to a file, and then graded against the success check. Nine of fifteen
    bullets passed. The bullet that failed in all three was the last one, and in each case
    what it required was either absent from the instructions or present only as a subordinate
    clause: exercising chaining where an instruction had asked only that a reference be returned,
    the case of the function shipping as a library where no instruction mentioned it, and
    whether the caller needs the reason for an absence where that appeared as a parenthesis
    inside a step about return types. Reading the closing bullet of twenty-nine rewritten
    checks in the same lane shows the position is a convention rather than a coincidence:
    it is where the fabrication-resistant requirement is placed, recurring in three phrasings
    - the opposite failure is checked, the cost is named, a stated near-miss passes every
    bullet above.

    '
  diagnosis:
    failure_layer: training
    hypothesis: 'The check and the instructions were written to different audiences. The check
      is built so a completed attempt cannot satisfy it by being completed, which is what
      the closing bullet is for and why it asks for something the exercise does not hand over.
      The instructions are built to be followed. Nothing reconciles the two, so a runner working
      from the instructions alone systematically fails the one bullet that was designed to
      be hard to fake, and fails it for the wrong reason - not because they could not do it,
      but because they were never told it was part of the work. The repair is on the instruction
      side: the check is doing its job.

      '
  boundary: 'Three drills, one sitting, one runtime, spanning two authoring batches and three
    shapes - a C++ resource-ownership rewrite, a language-agnostic classification ending in
    a choice, and a refactoring whose middle stage must fail to compile. The convention claim
    behind it is stronger than the scoring claim: the placement of the fabrication-resistant
    bullet was read directly off twenty-nine checks and is verifiable without running anything,
    whereas nine of fifteen is one sitting graded by the runtime that produced the answers
    and should not be treated as a rate. The measurement also hid the success check deliberately,
    to score production rather than recognition; in ordinary use a runner opens one file and
    sees the whole drill, so a runner who reads the check first simply does the extra thing
    and the gap never appears. What is evidenced is that the instructions alone do not carry
    a runner to the closing bullet - not that the drills are unpassable. Untested on the art
    and writing lanes, whose checks were rewritten in the same pass and have not been taken.

    '
