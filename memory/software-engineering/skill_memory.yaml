- id: SE_MEM_012
  scope_type: topic
  scope_id: a_count_is_not_a_finding
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: 'Three separate times a measurement was correct and the conclusion drawn from
    it was not, each by a different mechanism. A pattern that was right returned a real total
    from the wrong region, so unwrapped calls came to one thousand one hundred and fifty six
    of which one thousand and eighty three sat in files containing tests, and an assertion
    count was inflated by examples living inside docstrings. A ratio arrived with an explanation
    already attached, and the explanation about deliberate encapsulation survived until call
    sites were sampled and showed the discriminator was simply whether an underlying failure
    existed. A keyword sweep across three lanes matched forty three bullets of which six were
    genuine, the rest being ordinary uses of the matched words. In every case the number itself
    was sound and would have survived any review of the pattern that produced it.

    '
  diagnosis:
    failure_layer: application
    hypothesis: 'A total reads as a result because it was expensive to obtain and is hard
      to dispute, and the three failures are what fills the gap between having a number and
      having a claim. Region contamination is invisible because the pattern is correct. An
      invented cause is persuasive because a clean ratio looks as though it contains its own
      explanation. A keyword match is treated as a finding because scanning felt like the
      work. The operational form is to state which region a number covers whenever it is reported,
      to sample instances before naming a cause, and to treat any scan as a way of producing
      candidates for reading rather than results. The ratio here was six real findings to
      thirty seven false, so reporting the raw match count would have been wrong by a factor
      of seven.

      '
  boundary: 'Three sightings in one session by one runtime, across two source corpora and
    one sweep of this repository, all caught before anything was published and therefore recorded
    as near misses rather than as delivered errors. Distinct from the earlier entry on writing
    a search against the wrong idiom, where the pattern itself was faulty; here every pattern
