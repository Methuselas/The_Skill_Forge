- id: SE_MEM_003
  scope_type: ap
  scope_id: AP_review_code_you_did_not_write
  type: known_boundary
  evidence_class: deterministic_contract
  observation: >
    Executed end to end against a working multi-author codebase, the protocol produced a
    ranked defect list and a list of families examined and cleared, and nothing about
    technique worth carrying into the reviewer's own work. Its Objective asks for what is
    wrong and whether the code is sound enough for its purpose; step 7 asks what was
    examined and found acceptable, which records coverage rather than anything to adopt.
    The reviewer went looking for adoptable technique only after being asked, on a second
    pass over the same code, and roughly four fifths of what that pass produced turned out
    to be owned by cards already read during the review itself. A second run made the
    adoption pass an explicit instruction and required every named technique to arrive with
    the object id that owns it, or with a statement of what was searched and not found.
    That run reported eleven techniques owned against six with no owner, on a slice
    deliberately aimed at regions the first run had left untouched. A third run, the first
    on an unrelated codebase and on a freely chosen slice, reported eleven owned against two
    with no owner, and separately three cards judged right in direction but coarser than the
    practice - a category the first two runs did not produce at all. So the pass does return
    material the protocol does not; the unowned yield rises when the slice is aimed at thin
    regions and falls when it is chosen freely; the majority of what it returns is still
    recognition of canon already held; and a second kind of return exists beyond owned and
    unowned, being cards the code shows to be stated too coarsely.
  diagnosis:
    failure_layer: orchestration
    hypothesis: >
      The protocol was authored for the case where the reviewed code is worse than the
      library, which is the usual case and the one its steps are shaped around. Code that
      is better than the reviewer in some region produces nothing under it, and the second
      pass suggests the yield is mostly recognition of canon already held rather than new
      canon - which is worth knowing before adding a step that costs a pass.
  boundary: >
    Verified three times: twice on one large well-maintained codebase in two disjoint
    subsystems, once on an unrelated one of similar quality and different house style. Not
    verified on code of poorer quality, where the boundary may not matter. Whether a second
    pass yields anything a first pass would not is answered yes and quantified three times.
    The owned-to-unowned ratio does not hold steady across those runs and should not be
    treated as a constant - it appears to track how the slice was chosen more than how the
    codebase is written, which is the opposite of what the second run's boundary anticipated.
    What remains unverified is whether the same yield could be had inside one pass.
  confidence: repeated
  status: active
  evidence_count: 3
  evidence_events:
  - SE_EV_0001
  - SE_EV_0002
  - SE_EV_0003
  evidence_origin:
  - runtime_self_audit
