- id: SE_MEM_002
  scope_type: topic
  scope_id: reading_inconsistency_in_unfamiliar_code
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    On finding one class that signalled errors two different ways - a modern result type
    on its internal methods and a bare boolean with out-parameters on its public surface -
    the runtime moved to report the inconsistency as a defect to be unified. The split
    followed a layer boundary exactly, the outer surface reproduced a fixed external ABI
    that the project exists to reproduce faithfully, and the finding would have been wrong.
    What separated the two readings was whether the inconsistency fell along a line or
    scattered; nothing else in the code distinguished them.
  diagnosis:
    failure_layer: application
    hypothesis: >
      Consistency rules are easy to apply from a diff-sized view, so an inconsistency
      registers as a finding before the question of what the boundary is has been asked.
      The check that separates the two cases - does the variation follow a line, and is
      that line a layer, a platform, or an external contract - is cheap and was not part
      of the reviewer's default sequence.
  boundary: >
    Observed once, on error-signalling style in a codebase reimplementing a documented
    external API. Untested on naming, formatting, and structural inconsistency, and
    untested where no external contract is present to explain the split.
  confidence: provisional
  status: active
  evidence_count: 1
  evidence_events:
  - SE_EV_0001
  evidence_origin:
  - runtime_self_audit
  likely_owners:
  - PAT_settle_one_error_handling_strategy_systemwide
  retrieval_cues:
  - inconsistent style
  - two error mechanisms
  - unify the inconsistency
  - legacy interface
  - external ABI
  - reviewing unfamiliar code
  last_verified: '2026-08-27'
- id: SE_MEM_003
  scope_type: ap
  scope_id: AP_review_code_you_did_not_write
  type: known_boundary
  evidence_class: deterministic_contract
  observation: >
    Executed end to end against a working multi-author codebase, the protocol produced a
    ranked defect list and a list of families examined and cleared, and nothing about
    technique worth carrying into the reviewer's own work. Its Objective asks for what is
    wrong and whether the code is sound enough for its purpose; step 7 asks what was
    examined and found acceptable, which records coverage rather than anything to adopt.
    The reviewer went looking for adoptable technique only after being asked, on a second
    pass over the same code, and roughly four fifths of what that pass produced turned out
    to be owned by cards already read during the review itself. A second run made the
    adoption pass an explicit instruction and required every named technique to arrive with
    the object id that owns it, or with a statement of what was searched and not found.
    That run reported eleven techniques owned against six with no owner, on a slice
    deliberately aimed at regions the first run had left untouched. So the pass does return
    material the protocol does not, the yield improves when the slice is aimed at thin
    regions rather than chosen freely, and the majority of what it returns is still
    recognition of canon already held.
  diagnosis:
    failure_layer: orchestration
    hypothesis: >
      The protocol was authored for the case where the reviewed code is worse than the
      library, which is the usual case and the one its steps are shaped around. Code that
      is better than the reviewer in some region produces nothing under it, and the second
      pass suggests the yield is mostly recognition of canon already held rather than new
      canon - which is worth knowing before adding a step that costs a pass.
  boundary: >
    Verified twice, both times on the same large well-maintained codebase, in two disjoint
    subsystems. Not verified on code of poorer quality, where the boundary may not matter.
    Whether a second pass yields anything a first pass would not is now answered yes and
    quantified twice. What remains unverified is whether the same yield could be had inside
    one pass, and whether the owned-to-unowned ratio holds on a codebase whose house style
    differs from this one.
  confidence: repeated
  status: active
  evidence_count: 2
  evidence_events:
  - SE_EV_0001
  - SE_EV_0002
  evidence_origin:
  - runtime_self_audit
  - user_feedback
  likely_owners:
  - AP_review_code_you_did_not_write
  retrieval_cues:
  - reviewing code you did not write
  - what does this code do well
  - learn from a codebase
  - adopt a technique
  - review protocol
  - what is this code better at
