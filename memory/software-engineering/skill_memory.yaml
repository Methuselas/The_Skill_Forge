- id: SE_MEM_005
  scope_type: topic
  scope_id: reporting_a_guidance_defect
  type: recurring_failure
  evidence_class: stochastic_performance
  observation: >
    Across two review runs the runtime reported eight defects in cards. Five survived
    verification against the owning card and three did not. One card's IF already covered
    the case and what had failed was routing; a second card's Do already described the
    failure mode and again only routing had failed; a third card's rule already admitted
    the form being asked for, so the report was a preference rather than a defect. Every
    one of the three was caught by reading the owning card in full before editing, and
    none was caught by the reasoning that produced the report. In the second run the two
    unverified reports were the two cards the report itself had flagged as consulted by
    index entry rather than read. A third run, on an unrelated codebase, reported four and
    three survived. The one that failed was again the single card in the set that had been
    consulted by its Pattern Rule alone rather than read in full, so the association held on
    every instance across three runs. Its failure mode was new: the report claimed the card
    offered no option for a case, when the card's Do and Don't together already described
    that option - the missing piece was in the body the reviewer had not opened, which is
    the same place the previous misreports came from.
  diagnosis:
    failure_layer: application
    hypothesis: >
      A card that did not fire during a review is indistinguishable at the time from a
      card that could not have fired, because both present as silence. The reviewer
      attributes the silence to the card's wording, which is the visible candidate, when
      the more common cause is that the card was never reached. Reading the owning card in
      full separates them, and the correlation between not reading a card and misreporting
      it held on every instance so far.
  boundary: >
    Twelve reports across three runs on two codebases, by one reviewer against one library.
    The survival rate is not a stable figure and should not be treated as one. What is
    verified is the direction - reported defects over-count - and that full reading of the
    owning card is what separated the two kinds on all twelve. The correlation between
    having read a card only in summary and misreporting it has now held on four of four
    failures, which is strong enough to act on as a rule: do not report a card defective
    without reading its body. Untested on reports of missing cards rather than defective
    ones, and untested on whether a reviewer who reads every candidate owner in full still
    over-reports.
  confidence: repeated
  status: active
  evidence_count: 3
  evidence_events:
  - SE_EV_0001
  - SE_EV_0002
  - SE_EV_0003
  evidence_origin:
  - runtime_self_audit
  - user_feedback
