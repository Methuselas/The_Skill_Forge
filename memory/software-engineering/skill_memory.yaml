    outside test files landed at five point zero per thousand lines in a long-lived C plus
    plus game, six point zero in a C operating system, and six point one zero in a Rust command
    line tool, so three teams in three languages with no shared convention agree to within
    a fifth. Concurrency awareness in a monitoring server whose entire job is concurrent collection
    reached fifty six of four hundred and fifty three production files, about twelve percent,
    with forty four percent of all lock acquisitions sitting in eight files. Release form
    in that same codebase split roughly evenly between scope-bound and released by hand, one
    hundred and eighty eight against one hundred and fifty nine.

    '
  diagnosis:
    failure_layer: knowledge
    hypothesis: 'These are floors for noticing absence rather than targets to hit. Code carrying
      no runtime checks at all is the outlier that wants explaining, and concurrency reaching
      far past a handful of components is a sign it has leaked rather than been contained,
      because the monitoring server is close to a worst case and still keeps eighty eight
      percent of its files free of it. The even split on release form reads as defaulting
      to the form that cannot be forgotten and narrowing where a hot path justified it, rather
      than as inconsistency. Every one of these numbers is meaningless without its region
      stated, since test files run far denser on checks and would roughly triple the first
      figure.

