name: Example Skill
modules:
  - example/module
  # Add `teaching` only when this release should support the Teaching lane.
  # It is conditional and is never included automatically like metaskills.

# Runtime orchestration is vendored into each portable release.
runtime_profile: generic
# Deployment limits are release-target constraints, never authoring-health gates.
# Add a profile under PASS/runtime/deployment_profiles/ and name it here to gate
# a release on a target's package-size limit. No profiles ship by default.
# deployment_profile: <name>
