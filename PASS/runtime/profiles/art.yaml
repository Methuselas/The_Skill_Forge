schema_version: 1
profile_id: art
consumer_instructions:
- The latest explicit Art mode directive in the conversation is sticky. While Staged Mode is active, words such as finished, final, one image, one finished image, full-character image, or similar terminal-output language describe the eventual goal and never switch execution to Direct Render. Only an explicit user mode change or explicit exit from the staged thread may do that.
- The deterministic resolver is stateless. If an earlier turn established an active mode, pass that mode back to the resolver with --mode; never let a later brief fall back to the profile default merely because the mode words are absent from the current turn.
- In active staged Drawing, a request for one finished/final image means one eventual terminal image after the approval-gated Drawing thread; it does not suppress Stage 0 Search, intermediate approved artifacts, or approval gates.
- Any supplied attachment, archive, image set, or file that the user identifies as required character/design/reference authority must be inspected before dependent image generation, whether or not the user says golden truth. Resolve the relevant sheets plus explicit spec/rules first. If the package cannot be inspected or the relevant contents cannot be resolved, fail closed instead of generating.
- Never merely promise to use required references. Complete the reference inspection before the native image call, then preserve their locked design decisions at the current legal information resolution.
- "Before every productive staged image call, enforce this order: active-mode lock, authoritative-reference preflight, single legal current Drawing operation, current-resolution risk checks, artifact-only handoff, one current-artifact generation call, then stop for the user gate."
default_lane: skill
lanes:
  skill:
    label: Art execution
  teach:
    label: Art teaching and learning
lane_routing:
  rules:
  - lane: teach
    reason: explicit teaching/coaching/learning request
    when:
      any_phrases:
      - teach me
      - coach me
      - help me learn
      - lesson plan
      - practice plan
      - learning progression
      - assess my understanding
default_mode: direct_render
execution_modes:
  direct_render:
    aliases:
    - direct
    - render
    - final
    - one-shot
    - one shot
    label: Stage-informed Direct Render
    contract:
      stage_artifacts: false
      approval_gates: false
      apply_stage_knowledge: true
      post_render_verification: true
      rollback_enabled: false
      risk_region_review:
        enumerate_all_visible_instances: true
        inspect_full_frame_and_local_scale: true
        representative_sampling_allowed: false
      internal_stage_reasoning_only: true
      external_stage_artifacts: requested_terminal_artifact_only
  staged_production:
    aliases:
    - staged
    - stages
    - stage mode
    - process
    label: Staged Production
    contract:
      stage_artifacts: true
      approval_gates: true
      apply_stage_knowledge: true
      stage_thread_scope: drawing
      sequence:
      - 0
      - 1
      - 2
      - 3
      - 4
      commitment_checks: true
      rollback_enabled: true
      post_render_verification: true
      risk_region_review:
        enumerate_all_visible_instances: true
        inspect_full_frame_and_local_scale: true
        representative_sampling_allowed: false
      conversational_stage_revision_labels: true
      stage0_root_anchor_required: true
      immediate_approved_anchor_required: true
      prompt_carry_required: true
      visual_continuity_checks: true
      one_successor_artifact_per_approval: true
      tool_lineage_policy: use_when_exposed_never_simulate
      staged_controller: AP_progress_artifact_through_ratified_steps
      approval_provenance: explicit_user_only
      assistant_recommendation_is_approval: false
      rejected_candidate_resurrection: explicit_user_only
      current_stage_prompt_isolation: true
      stage_handoff_prompts_required: true
      stage_legal_next_actions_advertised: true
      stage_handoff_prompt_map:
        0: Select the thumbnail you like, with any revisions you may have, or reject them and I'll start over.
        1: Approve this structure to continue, tell me any structural revisions you want, or reject it and we'll return to
          the appropriate earlier stage.
        2: Approve this mass block to continue, tell me any mass or proportion revisions you want, or reject it and we'll
          return to the appropriate earlier stage.
        3: Approve this rough realization to continue, tell me any Stage 3 revisions you want, or reject it and we'll return
          to the appropriate earlier stage.
        4: These are the Finished Pencils that complete the Drawing thread. Request any final pencil revisions you want, or approve the Drawing as complete.
      stage_ap_thread:
        0: AP_run_stage0_rough_composition_search
        1: AP_build_stage1_scene_skeleton
        2: AP_build_stage2_complete_mass_block
        3: AP_realize_stage3_rough_image
        4: AP_finish_stage4_as_finished_pencils
      image_generation_handoff: AP_prepare_artifact_only_image_generation_handoff
      productive_workflow_vocabulary_suppressed: true
      current_artifact_only: true
      staged_mode_persistent_until_exit_or_completion: true
      staged_mode_state_owner: conversation_controller
      staged_mode_exit_requires_explicit_user_directive: true
      terminal_goal_language_does_not_change_active_mode: true
      stateless_resolver_requires_active_mode_override: true
      terminal_finished_image_request_is_eventual_goal_only: true
      direct_render_fallback_forbidden_while_staged: true
      authoritative_reference_preflight_required: true
      reference_authority_is_semantic_not_magic_phrase: true
      reference_preflight_must_complete_before_generation: true
      reference_preflight_fail_closed_if_unreadable: true
      rejection_never_advances: true
      invalid_artifact_cannot_anchor_successor: true
      registered_successor_required_after_approval: true
      stage0_structural_divergence_required: true
      stage0_candidate_budget_min: 4
      stage0_candidate_budget_max: 6
      stage0_candidate_budget_scope: global_per_open_search_cycle
      stage0_candidate_budget_owner: controller_only
      stage0_candidate_artifact_unit: one_composition_per_image
      stage0_native_generation_unit: one_candidate_per_call
      stage0_native_multi_output_forbidden: true
      stage0_image_facing_batch_vocabulary_forbidden: true
      stage0_contact_sheet_forbidden: true
      stage0_multi_panel_candidate_image_forbidden: true
      stage0_generator_self_selection_forbidden: true
      stage0_invalid_candidate_does_not_count_toward_budget: true
      stage0_prefer_separate_candidate_images: true
      stage_aware_risk_resolution_required: true
      staged_risk_resolver_requires_current_stage_after_stage0: true
      multi_step_presentation_default: forbidden
routing:
  rules:
  - mode: staged_production
    reason: explicit Mode staged directive has priority
    when:
      any_phrases:
      - mode staged
      - 'mode: staged'
      - mode = staged
  - mode: direct_render
    reason: explicit Mode direct directive has priority
    when:
      any_phrases:
      - mode direct
      - 'mode: direct'
      - mode = direct
  - mode: direct_render
    reason: explicit direct/skip-stages command suppresses external stage artifacts
    when:
      any_phrases:
      - just render
      - just make it
      - go straight to final
      - go directly to stage 4
      - no stages
      - direct render
  - mode: staged_production
    reason: explicit staged/process request
    when:
      any_phrases:
      - stage 0
      - stage 1
      - stage 2
      - stage 3
      - stage 4
      - staged production
      - stage mode
      - show the stages
      - show stages
      - step by step art process
      - construction passes
      - thumbnail pass
      - approval gate
      - in stages
      - do it in stages
      - work in stages
      - staged composition
      - staged drawing
      - staged illustration
      - staged image
      - staged art
      - staged workflow
      - staged process
      - composition in stages
  - mode: staged_production
    reason: training/drill/debugging requests externalize the process
    when:
      any_phrases:
      - drill
      - training
      - practice exercise
      - debug the drawing
      - debug this drawing
      - strength training
      - teach me the process
      - anatomy correction pass
  - mode: direct_render
    reason: explicit final-image wording confirms the default direct mode
    when:
      any_phrases:
      - final image
risk_rules:
- id: foreshortening
  when:
    any_phrases:
    - foreshorten
    - foreshortening
    - toward the camera
    - towards the camera
    - pointing at camera
    - pointing at the camera
    - extreme perspective
  checks:
  - foreground foreshortening
  - camera consistency
  - articulated reach chain
  checks_by_stage:
    0:
    - gross foreshortening read in gesture and silhouette
    - camera consistency
    - gross reach-chain continuity
    1:
    - structural foreshortening axes
    - camera consistency
    - articulated reach-chain scaffold
    2:
    - foreshortened mass consistency
    - camera consistency
    - articulated mass-chain continuity
    3:
    - foreground foreshortening
    - camera consistency
    - articulated reach chain
    4:
    - foreground foreshortening
    - camera consistency
    - articulated reach chain
- id: visible_hands
  when:
    any_phrases:
    - hand
    - hands
    - finger
    - fingers
    - fist
    - grip
    - grasp
    - gripping
    - holding
    - open hand
    - outstretched hand
    - reaching
  checks:
  - digit count for every visible hand
  - hand structure for every visible hand
  - hand-wrist-arm attachment chain for every visible hand
  checks_by_stage:
    0:
    - gross hand/contact intent
    - gross hand-to-limb continuity
    1:
    - hand block attached to correct limb chain
    - hand/contact location consistency
    2:
    - palm and hand mass consistency
    - contact plane and load direction
    - major opposition mass where structurally necessary
    3:
    - digit count for every visible hand
    - hand structure for every visible hand
    - hand-wrist-arm attachment chain for every visible hand
    4:
    - digit count for every visible hand
    - hand structure for every visible hand
    - hand-wrist-arm attachment chain for every visible hand
- id: supported_pose
  when:
    any_phrases:
    - standing
    - planted
    - leaning
    - sitting
    - crouch
    - crouching
    - kneeling
    - weight
    - support
    - contact
