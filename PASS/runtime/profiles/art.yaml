    - gross support/contact intent
    - gross center-of-mass and balance plausibility
    1:
    - support-point map
    - contact relationship consistency
    - balance scaffold
    2:
    - mass-to-support contact consistency
    - load direction
    - balance of blocked masses
    3:
    - weight and support
    - contact consistency
    - balance
    4:
    - weight and support
    - contact consistency
    - balance
- id: gaze_action
  when:
    any_phrases:
    - looking at
    - looking toward
    - looking towards
    - gaze
    - aiming
    - pointing
  checks:
  - gaze/action alignment
  checks_by_stage:
    0:
    - head/facing direction supports the action
    1:
    - head-axis/action alignment
    2:
    - head-mass/action alignment
    3:
    - gaze/action alignment
    4:
    - gaze/action alignment
- id: weapon_reach
