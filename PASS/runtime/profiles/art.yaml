schema_version: 1
profile_id: art
default_lane: skill
lanes:
  skill:
    label: Art execution
  teach:
    label: Art teaching and learning
lane_routing:
  rules:
    - lane: teach
      reason: explicit teaching/coaching/learning request
      when:
        any_phrases:
          - "teach me"
          - "coach me"
          - "help me learn"
          - "lesson plan"
          - "practice plan"
          - "learning progression"
          - "assess my understanding"
default_mode: direct_render
execution_modes:
  direct_render:
    aliases: [direct, render, final, one-shot, one shot]
    label: Stage-informed Direct Render
    contract:
      stage_artifacts: false
      approval_gates: false
      apply_stage_knowledge: true
      post_render_verification: true
      rollback_enabled: false
      risk_region_review:
        enumerate_all_visible_instances: true
        inspect_full_frame_and_local_scale: true
        representative_sampling_allowed: false
  staged_production:
    aliases: [staged, stages, stage mode, process]
    label: Staged Production
    contract:
      stage_artifacts: true
      approval_gates: true
      apply_stage_knowledge: true
      sequence: [0, 1, 2, 3, 4]
      parentage_checks: true
      commitment_checks: true
      rollback_enabled: true
      post_render_verification: true
      risk_region_review:
        enumerate_all_visible_instances: true
        inspect_full_frame_and_local_scale: true
        representative_sampling_allowed: false
routing:
  rules:
    - mode: direct_render
      reason: explicit direct/final request suppresses external stage artifacts
      when:
        any_phrases:
          - "just render"
          - "just make it"
          - "go straight to final"
          - "go directly to stage 4"
          - "no stages"
          - "direct render"
    - mode: staged_production
      reason: explicit staged/process request
      when:
        any_phrases:
          - "stage 0"
          - "stage 1"
          - "stage 2"
          - "stage 3"
          - "stage 4"
          - "staged production"
          - "stage mode"
          - "show the stages"
          - "show stages"
          - "step by step art process"
          - "construction passes"
          - "thumbnail pass"
          - "approval gate"
    - mode: staged_production
      reason: training/drill/debugging requests externalize the process
      when:
        any_phrases:
          - "drill"
          - "training"
          - "practice exercise"
          - "debug the drawing"
          - "debug this drawing"
          - "strength training"
          - "teach me the process"
          - "anatomy correction pass"
    - mode: direct_render
      reason: explicit final-image wording confirms the default direct mode
      when:
        any_phrases:
          - "final image"
risk_rules:
  - id: foreshortening
    when:
      any_phrases: [foreshorten, foreshortening, toward the camera, towards the camera, pointing at camera, pointing at the camera, extreme perspective]
    checks: [foreground foreshortening, camera consistency, articulated reach chain]
  - id: visible_hands
    when:
      any_phrases: [hand, hands, finger, fingers, fist, grip, grasp, gripping, holding, open hand, outstretched hand, reaching]
    checks: [digit count for every visible hand, hand structure for every visible hand, hand-wrist-arm attachment chain for every visible hand]
  - id: supported_pose
    when:
      any_phrases: [standing, planted, leaning, sitting, crouch, crouching, kneeling, weight, support, contact]
    checks: [weight and support, contact consistency, balance]
  - id: gaze_action
    when:
      any_phrases: [looking at, looking toward, looking towards, gaze, aiming, pointing]
    checks: [gaze/action alignment]
  - id: weapon_reach
    when:
      any_phrases: [gun, pistol, rifle, weapon, sword, spear]
    checks:
      - weapon-hand contact map
      - thumb opposition and active/support digit roles
      - digit count for every visible weapon hand
      - hand-wrist-arm attachment chain for every visible weapon hand
      - weapon-hand-arm attachment chain
      - focal hierarchy
  - id: articulated_endpoints
    when:
      any_phrases: [pose, action pose, combat pose, leap, leaping, jump, jumping, lunge, lunging, running, sprinting, kicking, reaching]
    checks:
      - hand-wrist-arm endpoint continuity
      - foot-ankle-leg endpoint continuity
      - head-neck attachment continuity
      - prop-contact endpoint continuity
  - id: character_reference_lock
    when:
      any_phrases: [reference sheet, reference sheets, ref sheet, ref sheets, character sheet, character sheets, golden truth, canon reference, canonical reference, lock pack]
    checks:
      - character identity and face lock
      - silhouette anchor lock
      - costume seam and emblem lock
      - equipment mount lock
      - palette lock
      - digit contract
completion_gate:
  required_checks: [instruction_fidelity_check, objective_check, risk_region_inventory_check, local_risk_inspection_check]
  require_all_risk_checks: true
